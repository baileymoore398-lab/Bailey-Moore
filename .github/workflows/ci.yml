name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend — lint + tests against a real Postgres service container.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: routeforge
          POSTGRES_PASSWORD: routeforge
          POSTGRES_DB: routeforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routeforge -d routeforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://routeforge:routeforge@localhost:5432/routeforge_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      ENV: test
      JWT_SECRET: ci-test-secret-not-real
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: routeforge-test
      AWS_ACCESS_KEY_ID: testkey
      AWS_SECRET_ACCESS_KEY: testsecret
      S3_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps (GDAL/FFmpeg/OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 ffmpeg gdal-bin libgdal-dev

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff / flake8 if configured)
        working-directory: backend
        run: |
          if [ -f pyproject.toml ] && grep -q "\[tool.ruff" pyproject.toml; then
            pip install ruff && ruff check .
          elif [ -f ruff.toml ] || [ -f .ruff.toml ]; then
            pip install ruff && ruff check .
          elif [ -f .flake8 ] || [ -f setup.cfg ] && grep -q "\[flake8\]" setup.cfg 2>/dev/null; then
            pip install flake8 && flake8 .
          else
            echo "No ruff/flake8 config found — skipping lint."
          fi

      - name: Run tests (pytest)
        working-directory: backend
        run: |
          if python -c "import pytest" 2>/dev/null || pip show pytest >/dev/null 2>&1; then
            pytest -q
          else
            pip install pytest
            if ls -R . 2>/dev/null | grep -qE "test_.*\.py|.*_test\.py"; then
              pytest -q
            else
              echo "No tests found — skipping."
            fi
          fi

  # ---------------------------------------------------------------------------
  # Frontend — install, lint, build.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend
        run: npm run build
