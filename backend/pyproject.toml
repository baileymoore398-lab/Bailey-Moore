[project]
name = "routeforge-backend"
version = "0.1.0"
description = "RouteForge — AI race analysis backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E741: short loop vars like `l` for legs are intentional and readable here.
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402", "F401"]
"app/workers/celery_app.py" = ["E402"]
